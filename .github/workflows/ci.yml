name: Python CI
on:
  push: { branches: [ main ] }
  pull_request: { branches: [ main ] }
permissions: { id-token: write, contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: flake8
      - name: Bandit security scan
        run: bandit -r projects -q || true
      - name: Tests
        run: |
          PYTHONPATH=projects/python/basics pytest projects/python/basics/tests -q
          PYTHONPATH=projects/web/flask-starter pytest projects/web/flask-starter/tests -q
          PYTHONPATH=projects/web/fastapi-starter pytest projects/web/fastapi-starter/tests -q

